<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 200" role="img" aria-labelledby="wtitle wdesc">
  <title id="wtitle">PromptSpark 使用流程</title>
  <desc id="wdesc">拖入 VSIX 安装，完全重启 Cursor，在 Composer 中优化提示词或发送快捷命令。</desc>
  <rect width="1200" height="200" rx="16" fill="#111315"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(40 40)">
      <rect width="340" height="120" rx="12" fill="#1A1E24" stroke="#343A44"/>
      <text x="24" y="38" fill="#FFB000" font-size="16" font-weight="600">01 安装</text>
      <text x="24" y="74" fill="#F5F6F8" font-size="20" font-weight="600">拖入 .vsix</text>
      <text x="24" y="104" fill="#8B929C" font-size="16">Extensions → Install from VSIX</text>
    </g>

    <path d="M400 100L418 100" stroke="#3A404A" stroke-width="2" stroke-linecap="round"/>
    <path d="M410 90L422 100L410 110" fill="none" stroke="#FFB000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(430 40)">
      <rect width="340" height="120" rx="12" fill="#1A1E24" stroke="#343A44"/>
      <text x="24" y="38" fill="#FFB000" font-size="16" font-weight="600">02 重启</text>
      <text x="24" y="74" fill="#F5F6F8" font-size="20" font-weight="600">完全退出再打开</text>
      <text x="24" y="104" fill="#8B929C" font-size="16">不是 Reload Window</text>
    </g>

    <path d="M790 100L808 100" stroke="#3A404A" stroke-width="2" stroke-linecap="round"/>
    <path d="M800 90L812 100L800 110" fill="none" stroke="#4C8DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(820 40)">
      <rect width="340" height="120" rx="12" fill="#1A1E24" stroke="#343A44"/>
      <text x="24" y="38" fill="#4C8DFF" font-size="16" font-weight="600">03 使用</text>
      <text x="24" y="74" fill="#F5F6F8" font-size="20" font-weight="600">优化 · 发送 · 切换</text>
      <text x="24" y="104" fill="#8B929C" font-size="16">闪光 / 左键 / 右键</text>
    </g>
  </g>
</svg>
