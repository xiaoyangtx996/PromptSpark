<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">PromptSpark</title>
  <desc id="desc">Optimize and shortcut commands beside Cursor Composer: left-click send, right-click switch, sparkle optimize and restore.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101214"/>
      <stop offset="100%" stop-color="#171A1F"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" rx="12" fill="url(#bg)"/>
  <path d="M0 332H1200" stroke="#2C3138" stroke-width="1"/>

  <g transform="translate(56 48)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="0" fill="#8B929C" font-size="18" font-weight="600" letter-spacing="1.2">CURSOR · WINDOWS</text>
    <text x="0" y="72" fill="#F5F6F8" font-size="64" font-weight="750">PromptSpark</text>
    <text x="0" y="122" fill="#FFB000" font-size="26" font-weight="650">Composer-side optimize and shortcuts</text>
    <text x="0" y="168" fill="#C3C8CF" font-size="20">Sparkle optimize / restore · left-click send · right-click switch</text>
    <text x="0" y="204" fill="#8B929C" font-size="18">OpenAI-compatible / Anthropic · local proxy · 3-tab settings</text>
  </g>

  <g transform="translate(640 40)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect width="504" height="248" rx="12" fill="#1A1E24" stroke="#3A404A"/>
    <text x="22" y="34" fill="#8B929C" font-size="16" font-weight="600">COMPOSER</text>
    <rect x="22" y="50" width="460" height="72" rx="10" fill="#242A32"/>
    <text x="40" y="94" fill="#D0D4DA" font-size="20">Clarify this requirement...</text>

    <g transform="translate(22 146)">
      <rect width="72" height="32" rx="8" fill="#2A313A"/>
      <text x="36" y="22" text-anchor="middle" fill="#F5F6F8" font-size="15" font-weight="600">Continue</text>
      <circle cx="108" cy="16" r="16" fill="#FFB000"/>
      <path d="M108 5L111 13L120 16L111 19L108 27L105 19L96 16L105 13Z" fill="#111315"/>
      <circle cx="444" cy="16" r="15" fill="#4C8DFF"/>
      <path d="M444 8L444 24M436 16L444 8L452 16" stroke="#F5F6F8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
