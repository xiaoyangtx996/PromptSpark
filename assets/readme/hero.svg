      <text x="120" y="0" fill="#FFB000">02</text><text x="148" y="0" fill="#C3C8CF">SPARK</text>
      <text x="250" y="0" fill="#4C8DFF">03</text><text x="278" y="0" fill="#F5F6F8">SEND</text>
    </g>
